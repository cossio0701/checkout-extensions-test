api_version = "2026-01"

[[extensions]]
name = "checkout-contact-fields"
handle = "checkout-contact-fields"
uid = "fbcbb4af-c13c-12e8-6cdd-d23e7a61cf18d018c050"
type = "ui_extension"

[[extensions.targeting]]
module = "./src/Checkout.jsx"
target = "purchase.checkout.contact.render-after"

[extensions.capabilities]
block_progress = true

# Customer metafields para pre-llenar datos cuando el usuario está logueado
[[extensions.metafields]]
namespace = "custom"
key = "tipo_documento"

[[extensions.metafields]]
namespace = "custom"
key = "numero_documento"

[[extensions.metafields]]
namespace = "custom"
key = "celular"

[extensions.settings]
[[extensions.settings.fields]]
key = "disable_co3"
type = "boolean"
name = "Ocultar cédula de ciudadanía (Colombia)"
description = "Marcar para deshabilitar este tipo de documento en el checkout"

[[extensions.settings.fields]]
key = "disable_pe3"
type = "boolean"
name = "Ocultar DNI (Perú)"
description = "Marcar para deshabilitar este tipo de documento en el checkout"

[[extensions.settings.fields]]
key = "disable_bl3"
type = "boolean"
name = "Ocultar cédula de identidad (Bolivia)"
description = "Marcar para deshabilitar este tipo de documento en el checkout"

[[extensions.settings.fields]]
key = "disable_cr3"
type = "boolean"
name = "Ocultar cédula de identidad (Costa Rica)"
description = "Marcar para deshabilitar este tipo de documento en el checkout"

[[extensions.settings.fields]]
key = "disable_ec3"
type = "boolean"
name = "Ocultar cédula de identidad (Ecuador)"
description = "Marcar para deshabilitar este tipo de documento en el checkout"

[[extensions.settings.fields]]
key = "disable_gt3"
type = "boolean"
name = "Ocultar DPI (Guatemala)"
description = "Marcar para deshabilitar este tipo de documento en el checkout"

[[extensions.settings.fields]]
key = "disable_pn3"
type = "boolean"
name = "Ocultar pasaporte (Panamá)"
description = "Marcar para deshabilitar este tipo de documento en el checkout"
